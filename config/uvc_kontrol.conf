# Nilai kontrol manual kamera UVC untuk scripts/kunci_kontrol_uvc.sh.
# Isi diatur setelah kalibrasi di bawah lampu tetap penelitian; nilai di bawah
# adalah titik awal, bukan hasil ukur.
#
# EXPOSURE: satuan 100 mikrodetik pada driver uvcvideo. 200 = 20 ms, kelipatan
#           10 ms agar sejalan dengan kedipan 100 Hz lampu jala-jala 50 Hz, dan
#           di bawah periode frame 33,3 ms pada 30 fps.
# WB_TEMPERATURE: kelvin.
# FOCUS: nilai fokus absolut sesuai jarak wajah ke kamera.
EXPOSURE=200
WB_TEMPERATURE=4500
FOCUS=30

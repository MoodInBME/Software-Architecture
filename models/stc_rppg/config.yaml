# Konfigurasi default STC-rPPG, mengikuti setting di paper
# (Bagian III & IV-B, "Implementation Details").

data:
  # Path relatif dari lokasi train.py (di dalam folder stc_rppg/) menuju
  # dataset_ubfc_loader.py. Sesuaikan kalau struktur folder Anda beda dari
  # Program/stc_rppg/train.py + Program/data/loaders/dataset_ubfc_loader.py
  loader_module_path: "/content/Software-Architecture/data/loaders/dataset_ubfc_loader.py"
  prepared_dir: "/content/pt_data"
  clip_len: 128 # T, paper terbaik pada UBFC-rPPG: 128 frame
  stride: 64 # overlap 50% antar klip
  train_ratio: 0.8 # split 8:2 per-subjek
  seed: 42
  batch_size:
    2 # diturunkan dari 4 -> OOM di GPU 15GB (Colab T4) walau
    # DiTAC sudah dioptimasi. Naikkan lagi kalau pakai GPU
    # >20GB (mis. A5000 seperti di paper).
  num_workers: 0 # disamakan dgn saran Colab (CPU core terbatas di runtime gratis)
  persistent_workers: False
  pin_memory: false

model:
  in_channels: 3
  fsfe_out_channels: 32
  stfe_out_channels: 32
  cdc_theta: 0.6 # koefisien central difference convolution

training:
  epochs: 30
  optimizer: adadelta # sesuai paper
  lr: 0.0001
  lambda_weight: 0.5 # lambda hybrid loss (Eq. 10), hasil tuning terbaik paper (Fig. 5)
  grad_clip_norm: 1.0 # jaring pengaman terhadap lonjakan loss_freq (lihat catatan di loss.py)
  mixed_precision: true # AMP -> hemat VRAM signifikan, penting utk GPU 15GB (Colab T4)
  device: "cuda" # ganti "cpu" kalau tidak ada GPU
  checkpoint_dir: "/content/checkpoints"
  resume: "auto" # otomatis lanjut dari checkpoint terakhir kalau ada
  save_every: 1 # simpan checkpoint tiap N epoch
  log_every: 20 # print log tiap N step

# Pita HR (0,75-4,0 Hz) tidak ditulis di sini. Nilainya hanya ada di
# models/stc_rppg/constants.py (HR_BAND_HZ) dan dipakai bersama oleh loss dan
# postprocessing. train.py menolak kunci lama freq_low, freq_high, lowcut, dan
# highcut agar config lama tidak diam-diam memakai pita yang berbeda.
loss:
  fps: 30.0

postprocessing:
  fps: 30.0
  order: 4
  n_fft: 4096

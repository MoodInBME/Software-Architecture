# Konfigurasi ST-GCN + Graph-Transformer (MoodIn) -- versi VA-bridge
model:
  in_channels: 2          # (x, y) landmark; set 3 bila + confidence/z
  num_class: 5
  num_node: 68            # subset iBUG dari MediaPipe FaceMesh (lihat landmark_map)
  graph_strategy: spatial # uniform | distance | spatial
  max_hop: 1
  t_kernel: 9
  transformer_layers: 2
  transformer_heads: 8
  transformer_ff: 512     # dim_ff TemporalTransformer
  dropout: 0.3
  head_type: va           # va | class | dual  (disepakati: va)

data:
  window_frames: 150      # ~5 detik @ 30 FPS
  fps: 30
  stride_frames: 15
  neutral_radius: 0.2

loss:
  # untuk head_type: dual
  alpha_va: 1.0
  beta_cls: 0.5

train:
  epochs: 80
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  device: cuda
  checkpoint_dir: checkpoints
  num_workers: 2

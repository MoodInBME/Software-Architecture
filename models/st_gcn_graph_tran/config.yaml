# Konfigurasi ST-GCN + Graph-Transformer (MoodIn) -- versi VA-bridge
model:
  in_channels: 2          # (x, y) landmark; set 3 bila + confidence/z
  num_class: 5
  num_node: 68            # subset iBUG dari MediaPipe FaceMesh (lihat landmark_map)
  graph_strategy: spatial # uniform | distance | spatial
  max_hop: 1
  t_kernel: 9
  # Rancangan Pra-TA (B.3, ISU-100): empat unit 64-64-128-128, stride 2 di unit ke-3,
  # tanpa Transformer. Susunan lama (6 unit + Transformer) tetap bisa dipakai untuk ablasi:
  # channels [64, 64, 128, 128, 256, 256], strides [1, 1, 2, 1, 2, 1], use_transformer true.
  channels: [64, 64, 128, 128]
  strides: [1, 1, 2, 1]
  use_transformer: false
  block_dropout: 0.5
  transformer_layers: 2
  transformer_heads: 8
  transformer_ff: 512     # dim_ff TemporalTransformer
  dropout: 0.3
  head_type: va           # va | class | dual | au_va  (bawaan va; au_va setelah data DISFA tersedia)
  # AU kepala au_va (bimbingan 24 Nov 2026: AU7 diganti AU1). Label: DISFA intensitas 0..5
  # dan Aff-Wild2 kemunculan 0/1; peta kolom ada di au_labels.py.
  au_list: [1, 4, 6, 12]
  au_sumber: [disfa, affwild2]

data:
  window_frames: 90       # 3 detik @ 30 FPS (rancangan Pra-TA; era GEMASTIK 150)
  fps: 30
  stride_frames: 15
  mood_rule: tabel33      # tabel33 (rancangan Pra-TA) | lingkaran (arsip GEMASTIK)
  neutral_radius: 0.2     # hanya dipakai mood_rule: lingkaran

loss:
  # untuk head_type: dual
  alpha_va: 1.0
  beta_cls: 0.5

train:
  epochs: 80
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  device: cuda
  checkpoint_dir: checkpoints
  num_workers: 2
